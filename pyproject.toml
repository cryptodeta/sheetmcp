[project]
name = "sheetmcp"
version = "0.3.0"
description = "The Excel/CSV MCP server that actually works: formulas, SQL across many files, safe writes. No API keys. Includes the sheetmcp.core engine and the sheetcli tool."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SheetMCP contributors" }]
keywords = ["mcp", "model-context-protocol", "excel", "xlsx", "csv", "parquet", "duckdb", "openpyxl", "spreadsheet", "llm", "claude", "cursor"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = ["openpyxl>=3.1", "duckdb>=1.1", "mcp>=1.12,<2"]

[project.optional-dependencies]
xls = ["xlrd>=2.0.1"]

[project.scripts]
sheetmcp = "sheetmcp.__main__:main"
sheetcli = "sheetmcp.cli.main:main"

[project.urls]
Homepage = "https://github.com/cryptodeta/sheetmcp"
Issues = "https://github.com/cryptodeta/sheetmcp/issues"
Changelog = "https://github.com/cryptodeta/sheetmcp/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheetmcp"]

[tool.hatch.build.targets.sdist]
include = ["/src/sheetmcp", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "anyio>=4", "xlrd>=2.0.1", "xlwt>=1.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "B905", "RUF001", "RUF002", "RUF003", "SIM108", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
