[project]
name = "sheetmcp-workspace"
version = "0.1.0"
description = "Workspace root for SheetMCP (not published)"
requires-python = ">=3.10"
dependencies = ["sheetmcp", "sheetmcp-core", "sheetmcp-cli"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sheetmcp = { workspace = true }
sheetmcp-core = { workspace = true }
sheetmcp-cli = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "anyio>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["packages/core/src", "packages/server/src", "packages/cli/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "B905", "RUF001", "RUF002", "RUF003", "SIM108", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
