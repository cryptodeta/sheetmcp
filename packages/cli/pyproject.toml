[project]
name = "sheetmcp-cli"
version = "0.1.0"
description = "Tiny command line for SheetMCP's spreadsheet engine (query, convert, profile, diff...)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "SheetMCP contributors" }]
dependencies = ["sheetmcp-core==0.1.0"]

[project.scripts]
sheetcli = "sheetmcp_cli.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheetmcp_cli"]
