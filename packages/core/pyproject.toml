[project]
name = "sheetmcp-core"
version = "0.1.0"
description = "Fast, lightweight spreadsheet engine (Excel/CSV/Parquet/JSON) powering SheetMCP. No MCP dependency."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "SheetMCP contributors" }]
keywords = ["excel", "xlsx", "csv", "parquet", "duckdb", "openpyxl", "spreadsheet"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = ["openpyxl>=3.1", "duckdb>=1.1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheetmcp_core"]
