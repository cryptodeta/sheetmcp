name: Release

# Runs on every push to main. A release happens only when VERSION.md holds a version
# strictly greater than the latest v* tag; otherwise the workflow ends green with a skip note.
# Run it by hand with "republish" to retry PyPI publishing for an existing tag (no new tag or release).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      republish:
        description: "Retry PyPI publishing for the current VERSION.md tag"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/cryptodeta/sheetmcp

jobs:
  check:
    name: Check VERSION.md
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      publish: ${{ steps.publish.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: check
        run: python3 scripts/version.py release-check >> "$GITHUB_OUTPUT"
      - id: publish
        env:
          REPUBLISH: ${{ inputs.republish }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          if [ "${{ steps.check.outputs.release }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$REPUBLISH" = "true" ] && git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Republishing the existing tag v$VERSION to PyPI (no new tag or release)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build, tag and GitHub Release
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Sync package versions from VERSION.md
        run: python3 scripts/version.py sync
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Build wheels and sdists
        run: |
          rm -rf dist
          uv build --out-dir dist
          test "$(ls dist | wc -l)" = 2
          ls -l dist
      - name: Smoke test wheels
        run: |
          uvx --no-cache --find-links dist --from "sheetmcp==$VERSION" sheetmcp --version
          uvx --no-cache --find-links dist --from "sheetmcp==$VERSION" sheetcli --version
      - name: Commit synced versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git commit -am "chore(release): v$VERSION [skip ci]"
            git push origin HEAD:main || echo "::warning::Could not push the version sync commit to main; the tag still points at it."
          fi
      - name: Tag
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists"
          else
            git tag -a "v$VERSION" -m "v$VERSION"
            git push origin "v$VERSION"
          fi
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/version.py notes "$VERSION" > release-notes.md
          cat >> release-notes.md <<NOTES

          ## Install

          - PyPI: \`uvx sheetmcp@$VERSION\` or \`pip install sheetmcp==$VERSION\` (includes \`sheetcli\`)
          - Docker (GitHub Packages): \`docker pull $IMAGE:$VERSION\`
          - The wheel and sdist are attached below.
          NOTES
          flags=()
          [ "${{ needs.check.outputs.prerelease }}" = "true" ] && flags+=(--prerelease)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/* --clobber
          else
            gh release create "v$VERSION" dist/* --title "v$VERSION" --notes-file release-notes.md --verify-tag "${flags[@]}"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI (trusted publishing)
    needs: [check, release]
    if: >-
      always() && needs.check.outputs.publish == 'true' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sheetmcp/
    permissions:
      contents: read
      id-token: write # OIDC: PyPI trusted publishing, no API token
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -D dist -p '*.whl' -p '*.tar.gz'
          ls -l dist
      - name: Check the PyPI trusted publisher
        id: probe
        run: |
          # Exchange this job's OIDC token the same way the publish action does; fails when no publisher matches.
          aud=$(curl -fsS https://pypi.org/_/oidc/audience | jq -r .audience)
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$aud" | jq -r .value)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://pypi.org/_/oidc/mint-token \
            -H 'Content-Type: application/json' -d "{\"token\":\"$oidc\"}")
          if [ "$code" = "200" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            msg="PyPI publish skipped: no trusted publisher matches this workflow (HTTP $code). Add the trusted publisher on the sheetmcp PyPI project (README > Releasing), then re-run with republish."
            echo "::warning::$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish sheetmcp
        if: steps.probe.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - if: steps.probe.outputs.publish == 'true'
        run: echo "Published https://pypi.org/project/sheetmcp/$VERSION/" >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Publish Docker image to ghcr.io (GitHub Packages)
    needs: [check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ needs.check.outputs.version }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.check.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.check.outputs.version }}
            type=raw,value=latest,enable=${{ needs.check.outputs.prerelease != 'true' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "Published ${{ env.IMAGE }}:${{ needs.check.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
